name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push supersedes the run before it on the same ref. Without this a
# branch pushed three times runs three full matrices, and only the last
# one's verdict is the one anybody reads.
#
# Not on main, though. Canceling a superseded branch run costs nothing;
# canceling one on the default branch leaves a merged commit with no
# verdict at all, and whoever bisects later finds a green history with a
# hole in it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# bash on every runner, for every `run` step in this file. With the
# default shell, PowerShell on the Windows runner turned
# `-coverprofile=cov.out` into a file called `cov`, so the profile the
# next step read did not exist under the name this file gives it, and
# nobody saw it because the coverage gate ran on Linux only until it
# stopped being a shell script.
#
# Set here rather than on the job or the step. The runner hands every
# `run` block to a shell, so this is not about which steps look
# shell-ish, and a default set at this level is inherited by a job
# somebody adds later. Two things it does not do: it never reaches a
# `uses:` step, and it is not the shell the implicit default gives you —
# GitHub runs an explicit bash as `bash --noprofile --norc -eo pipefail`,
# so a command failing mid-pipeline now fails the step on all three
# runners. The `pins` gate in `scripts/gates` checks this block is here.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race -coverpkg=./internal/... -coverprofile=cov.out -covermode=atomic ./...
      - name: coverage floor
        run: go run ./scripts/gates coverage cov.out 80

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: out=$(gofmt -l .); [ -z "$out" ] || { echo "$out"; exit 1; }
      - run: go vet ./...
      # The tagged passes. Without them the build-tagged files compile
      # only where somebody runs `make check` by hand, which is what the
      # parity gate now refuses.
      - run: go vet -tags=integration ./...
      - run: go vet -tags=live ./...
      - run: go vet -tags=evals ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: licenses
        run: go run github.com/google/go-licenses@v1.6.0 check ./... --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,MIT,ISC

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The scanner this wrapper installs, pinned like cosign and
          # syft. It differs from those two in the mechanism and in the
          # risk: the version is an env var rather than a `with:` input,
          # and the action's default is a hard-coded number rather than
          # `latest`, so a SHA here already pins something. Named anyway,
          # so which gitleaks ran is a line in this file rather than a
          # constant inside a five-megabyte bundle. No `v` prefix — the
          # action's README documents the bare form.
          GITLEAKS_VERSION: "8.30.1"

  # A pull request is measured from the merge-base of its head and the
  # base branch. github.event.pull_request.base.sha is fixed when the
  # event fires and goes stale in a stack of pull requests.
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_BASE_REF: origin/${{ github.base_ref }}
      # The head commit, not the merge commit the checkout sits on.
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: schema change acknowledged
        run: go run ./scripts/gates schema-ack "$PR_BASE_REF" "$PR_HEAD"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The flags make build and schema-ack use, so the tag schema-diff
      # builds shares the cache.
      - run: CGO_ENABLED=0 go build -trimpath -o google-docs-mcp ./cmd/google-docs-mcp
      - run: go run ./scripts/gates smoke ./google-docs-mcp
      - run: go run ./scripts/gates schema-diff ./google-docs-mcp
      - run: go run ./scripts/gates staleness ./google-docs-mcp
      - run: go run ./scripts/gates leaks
      - run: go run ./scripts/gates pins
      - run: go run ./scripts/gates classes
      - run: go run ./scripts/gates transcript
      - run: go run ./scripts/gates mcpb
      - run: go run ./scripts/gates api-coverage
      - run: go run ./scripts/gates api-fields
      - run: go run ./scripts/gates parity
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schemas
          path: schemas.json
