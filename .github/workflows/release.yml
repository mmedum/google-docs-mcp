name: release

on:
  push:
    tags: ["v*"]
  # Pushing more than three tags at once makes GitHub drop the tag
  # events, and a release job can fail for reasons that have nothing to
  # do with the tag, so it can also be run by hand against a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
