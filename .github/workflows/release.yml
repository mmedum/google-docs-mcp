name: release

on:
  push:
    tags: ["v*"]
  # Pushing more than three tags at once makes GitHub drop the tag
  # events, and a release job can fail for reasons that have nothing to
  # do with the tag, so it can also be run by hand against a tag.
  workflow_dispatch:

# Read by default; the release job raises only what it needs.
permissions:
  contents: read

# bash on every runner, for every `run` step in this file. Uniform
# across workflows, and the `pins` gate checks it (pinsShell); ci.yml
# carries why.
defaults:
  run:
    shell: bash

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Keyless signing and build provenance both prove who built the
      # artifacts, and both need an OIDC token to do it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      # Pinning the action does not pin what the action installs: both of
      # these fetch a tool, and an unpinned tool is an unpinned build
      # dependency wearing a pinned wrapper. A new cosign major can change
      # what signing needs (.goreleaser.yaml's signs block says what).
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.51.1
      # The release body is the CHANGELOG.md section for this tag, not a
      # list of commit SHAs. `gates release-notes` fails when the tag has
      # no section, which fails the release rather than publishing one
      # that says nothing.
      - name: Release notes from the CHANGELOG
        env:
          REF_NAME: ${{ github.ref_name }}
        run: go run ./scripts/gates release-notes "${REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Exact, not "~> v2": this input takes a semver range and
          # installs the highest match, so a SHA on the action still
          # leaves goreleaser, which decides what the artifacts are,
          # floating. https://github.com/goreleaser/goreleaser-action#inputs
          version: "v2.18.1"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Provenance ties every published archive to this workflow, this
      # commit and this runner, checkable with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The bundle is a subject in its own right. Its row in
          # checksums.txt is a claim about the checksum file rather than
          # about the bundle: without this, `gh attestation verify` on the
          # .mcpb answers 404 while every archive passes. The bundle is
          # what most people actually install.
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/*.mcpb,dist/checksums.txt"

  # The registry entry, in its own workflow so it can also be run by hand
  # against a tag that already shipped. publish-mcp.yml says why.
  registry:
    needs: goreleaser
    # A prerelease rehearses the pipeline and must NOT rehearse the
    # registry: an entry cannot be taken back, so a -rc tag would leave a
    # permanent row pointing at a bundle nobody should install.
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/publish-mcp.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      id-token: write
      contents: read
