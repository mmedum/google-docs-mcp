name: release

on:
  push:
    tags: ["v*"]
  # Pushing more than three tags at once makes GitHub drop the tag
  # events, and a release job can fail for reasons that have nothing to
  # do with the tag, so it can also be run by hand against a tag.
  workflow_dispatch:

# Read by default; the release job raises only what it needs.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless signing and build provenance both prove who built the
      # artifacts, and both need an OIDC token to do it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      # Pinning the action does not pin what the action installs: both of
      # these fetch a tool, and an unpinned tool is an unpinned build
      # dependency wearing a pinned wrapper. cosign 3 is what broke the
      # first attempt at this release.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Provenance ties every published archive to this workflow, this
      # commit and this runner, checkable with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/checksums.txt"
