version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - misspell
    - unparam
    - gocritic
    - revive
    - bodyclose
    - errorlint
    - nilerr
    - prealloc
    - makezero
    - forbidigo
  settings:
    misspell:
      locale: US
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: stdout carries only MCP JSON-RPC frames; write through the boundary helpers
        - pattern: ^os\.Stdout$
          msg: stdout carries only MCP JSON-RPC frames; take an io.Writer instead
        # The server asks the person nothing; the client approves each
        # call (docs/architecture.md §12a). These are the two ways to ask:
        # a form elicitation, and the input requests a result carries from
        # protocol 2026-07-28.
        - pattern: \.Elicit$
          pkg: ^github\.com/modelcontextprotocol/go-sdk/mcp$
          msg: the server asks the person nothing; refuse the call, or make the risky variant its own tool
        - pattern: ^mcp\.(ElicitParams|InputRequestMap)$
          msg: the server asks the person nothing; refuse the call, or make the risky variant its own tool
    gocyclo:
      min-complexity: 25
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: var-naming
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: unused-parameter
        - name: empty-block
        - name: unreachable-code
  exclusions:
    rules:
      # scripts/ is maintainer tooling run at a terminal, not the server.
      - path: ^scripts/
        linters: [forbidigo]
      - path: _test\.go
        linters: [gocyclo, unparam, errcheck, bodyclose, revive, prealloc]

formatters:
  enable:
    - gofmt
