version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - misspell
    - unparam
    - gocritic
    - revive
    - bodyclose
    - errorlint
    - nilerr
    - prealloc
    - makezero
    - forbidigo
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: stdout carries only MCP JSON-RPC frames; write through the boundary helpers
        - pattern: ^os\.Stdout$
          msg: stdout carries only MCP JSON-RPC frames; take an io.Writer instead
    gocyclo:
      min-complexity: 25
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: var-naming
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: unused-parameter
        - name: empty-block
        - name: unreachable-code
  exclusions:
    rules:
      # scripts/ is maintainer tooling run at a terminal, not the server.
      - path: ^scripts/
        linters: [forbidigo]
      - path: _test\.go
        linters: [gocyclo, unparam, errcheck, bodyclose, revive, prealloc]

formatters:
  enable:
    - gofmt
