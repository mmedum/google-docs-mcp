version: 2

project_name: google-docs-mcp

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/google-docs-mcp
    binary: google-docs-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # Stamp the commit's time rather than the build's, so rebuilding the
    # same tag produces byte-identical binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/mmedum/google-docs-mcp/internal/version.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

# One SBOM per archive, so a deployer can see what is inside a binary
# they did not build.
sboms:
  - artifacts: archive

# Sign the checksum file with a keyless Sigstore certificate tied to the
# workflow's OIDC identity: no private key to hold or leak.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  # A tag is the decision; a draft nobody publishes is how releases go
  # missing. Pre-1.0 tags are still marked as pre-releases automatically
  # for anything carrying a suffix like -rc1.
  draft: false
  prerelease: auto
  footer: |
    Built by GoReleaser from the tag. Verify a download against
    `checksums.txt`; every archive carries the binary, LICENSE and README.
