version: 2

project_name: google-docs-mcp

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/google-docs-mcp
    binary: google-docs-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # Stamp the commit's time rather than the build's, so rebuilding the
    # same tag produces byte-identical binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/mmedum/google-docs-mcp/internal/version.Version={{.Tag}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

# One SBOM per archive, so a deployer can see what is inside a binary
# they did not build.
sboms:
  - artifacts: archive

# Sign the checksum file with a keyless Sigstore certificate tied to the
# workflow's OIDC identity: no private key to hold or leak. --bundle is
# not a preference here: cosign's v3.0.1 notes say it "has moved from
# optional to required in v3", so the v0.8.0 release did not degrade
# quietly when cosign-installer fetched 3 — it failed with no output path
# at all. The notes say nothing about --output-signature or
# --output-certificate, so do not describe them as dropped.
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# No changelog block: the release body is the CHANGELOG.md section for the
# tag, built by scripts/relnotes and passed with --release-notes, so a
# generated commit list would only be a second, worse account of the same
# release. Never set changelog.disable to get that effect — it is read in
# the pipe's Skip method, before the notes file is loaded, and the body
# collapses to this footer with nothing above it. The footer below still
# applies: internal/pipe/release/body.go wraps ReleaseNotes in
# release.header and release.footer on every path.

release:
  # A tag is the decision; a draft nobody publishes is how releases go
  # missing. Pre-1.0 tags are still marked as pre-releases automatically
  # for anything carrying a suffix like -rc1.
  draft: false
  prerelease: auto
  footer: |
    ---

    Built by GoReleaser from the tag. Every archive carries the binary,
    LICENSE and README, and ships an SBOM beside it.

    Verify a download before you run it:

    ```bash
    sha256sum -c checksums.txt --ignore-missing
    cosign verify-blob checksums.txt --bundle checksums.txt.bundle \
      --certificate-identity-regexp 'https://github\.com/mmedum/google-docs-mcp/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    gh attestation verify google-docs-mcp_*.tar.gz --repo mmedum/google-docs-mcp
    ```
