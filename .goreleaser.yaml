version: 2

project_name: google-docs-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: google-docs-mcp
    main: ./cmd/google-docs-mcp
    binary: google-docs-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # Stamp the commit's time rather than the build's, so rebuilding the
    # same tag produces byte-identical binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
    # {{ .Version }} rather than {{ .Tag }}: on a tag they are the same
    # string either side of the `v`, which internal/version restores —
    # but in a --snapshot rehearsal .Tag is the last tag while everything
    # else carries the snapshot version, so the binary is the one place
    # that disagrees and the bundle's five-way version check cannot be
    # rehearsed.
      - -s -w -X github.com/mmedum/google-docs-mcp/internal/version.Version={{ .Version }}

# The macOS universal binary exists for the Claude Desktop bundle alone.
# A manifest names a command per PLATFORM and has no key for the
# architecture, so the macOS entry has to work on both. `ids` on the
# archives keeps it out of them: a fourth macOS download on the release
# page is a choice nobody should have to make.
universal_binaries:
  - id: google-docs-mcp-universal
    ids: [google-docs-mcp]
    replace: false
    hooks:
      # The one point in the pipeline where every binary exists and
      # checksums.txt has not been written, which is what MAKES it
      # possible for the bundle to be in that file and therefore under
      # the signature. It is not what puts it there: goreleaser hashes
      # the artifacts IT built, and a file a hook drops into dist/ is not
      # one. `checksum.extra_files` covers it and `release.extra_files`
      # uploads it — both, or the bundle ships unsigned, or is hashed and
      # never published, looking no different either way.
      post: go run ./scripts/gates mcpb-pack dist {{ .Version }} dist/google-docs-mcp_{{ .Version }}.mcpb

archives:
  - ids: [google-docs-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  # The bundle is not an archive goreleaser built, so packing it in the
  # post hook is only half of what puts it here — the checksum step
  # covers its own artifacts, and a file a hook dropped into dist/ is not
  # one. Naming it is the other half, and being in checksums.txt is what
  # gets it signed, because the signature is over that file.
  extra_files:
    - glob: ./dist/*.mcpb

# One SBOM per archive, so a deployer can see what is inside a binary
# they did not build.
sboms:
  - artifacts: archive

# Sign the checksum file with a keyless Sigstore certificate tied to the
# workflow's OIDC identity: no private key to hold or leak. --bundle is
# not a preference here: cosign's v3.0.1 notes say it "has moved from
# optional to required in v3", so the v0.8.0 release did not degrade
# quietly when cosign-installer fetched 3 — it failed with no output path
# at all. The notes say nothing about --output-signature or
# --output-certificate, so do not describe them as dropped.
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# No changelog block: the release body is the CHANGELOG.md section for the
# tag, built by scripts/relnotes and passed with --release-notes, so a
# generated commit list would only be a second, worse account of the same
# release. Never set changelog.disable to get that effect — it is read in
# the pipe's Skip method, before the notes file is loaded, and the body
# collapses to this footer with nothing above it. The footer below still
# applies: internal/pipe/release/body.go wraps ReleaseNotes in
# release.header and release.footer on every path.

release:
  # A tag is the decision; a draft nobody publishes is how releases go
  # missing. Pre-1.0 tags are still marked as pre-releases automatically
  # for anything carrying a suffix like -rc1.
  draft: false
  prerelease: auto
  # Checksummed is not uploaded. Without this the bundle is named in
  # checksums.txt and absent from the release, which is a hash of
  # something nobody can download.
  extra_files:
    - glob: ./dist/*.mcpb
  footer: |
    ---

    Built by GoReleaser from the tag. Every archive carries the binary,
    LICENSE and README, and ships an SBOM beside it.

    Verify a download before you run it:

    ```bash
    sha256sum -c checksums.txt --ignore-missing
    cosign verify-blob checksums.txt --bundle checksums.txt.bundle \
      --certificate-identity-regexp 'https://github\.com/mmedum/google-docs-mcp/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    gh attestation verify google-docs-mcp_*.tar.gz --repo mmedum/google-docs-mcp
    ```

    `.mcpb` is the Claude Desktop bundle: open it and Claude Desktop
    installs the server and asks for your settings, with no config file
    to edit. It covers macOS, Windows and Linux on both architectures. It
    does **not** log you in — install the binary as well, run
    `google-docs-mcp login` once, and the bundle picks up the same
    credentials. Its SHA-256 is in the same signed `checksums.txt`.
