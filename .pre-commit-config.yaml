repos:
  - repo: local
    hooks:
      # Through the Makefile, so the hook scans with the gitleaks version
      # `make check` and CI run. A remote hook's rev would be a second
      # version, and the `pins` gate refuses one.
      - id: gitleaks
        name: gitleaks
        entry: make gitleaks-staged
        language: system
        pass_filenames: false
      - id: gofmt
        name: gofmt
        entry: make fmt
        language: system
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
