repos:
  - repo: https://github.com/gitleaks/gitleaks
    # Kept equal to GITLEAKS_VERSION in .github/workflows/ci.yml, and
    # TestScannersAgree fails if they drift. Two versions means a commit
    # can pass the hook and fail the job, on rules that exist in one and
    # not the other — the local check would then be teaching the wrong
    # thing about what CI will say.
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'out=$(gofmt -l .); [ -z "$out" ] || { echo "$out"; exit 1; }'
        language: system
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
